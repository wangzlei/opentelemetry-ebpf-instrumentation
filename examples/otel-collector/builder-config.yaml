dist:
  name: otelcol-dev
  description: Basic OTel Collector distribution for Developers
  output_path: ./otelcol-dev

replaces:
  - go.opentelemetry.io/obi => ../../..

exporters:
  - gomod:
      go.opentelemetry.io/collector/exporter/debugexporter v0.151.0
  - gomod:
      go.opentelemetry.io/collector/exporter/otlpexporter v0.151.0
  # CloudWatch Metrics OTLP ingest is plain OTLP/HTTP + SigV4.
  - gomod:
      go.opentelemetry.io/collector/exporter/otlphttpexporter v0.151.0

extensions:
  # SigV4 signer for the CloudWatch OTLP metrics endpoint.
  - gomod:
      github.com/open-telemetry/opentelemetry-collector-contrib/extension/sigv4authextension v0.151.0

processors:
  - gomod:
      go.opentelemetry.io/collector/processor/batchprocessor v0.151.0
  # CloudWatch OTLP requires DELTA temporality; convert if OBI emits cumulative.
  - gomod:
      github.com/open-telemetry/opentelemetry-collector-contrib/processor/cumulativetodeltaprocessor v0.151.0
  # Rename/derive AWS-flavored resource attributes (ec2.instance.id, aws.*, host.ip).
  # Pinned to v0.158.0 to match the collector core OBI pulls in: the v0.151.0
  # transformprocessor's ottl fails to compile against pprofile v0.158.0.
  - gomod:
      github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.158.0
  # Split spans by kind so each spanmetrics connector emits one semconv name.
  - gomod:
      github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.158.0

connectors:
  # Derive RED metrics from spans with fully configurable dimensions
  # (peer.service.name, http.route, ...); resource attributes carry through.
  - gomod:
      github.com/open-telemetry/opentelemetry-collector-contrib/connector/spanmetricsconnector v0.158.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.151.0
  - gomod: go.opentelemetry.io/obi v0.5.0
    import: go.opentelemetry.io/obi/collector

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.57.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.57.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/httpprovider v1.57.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/httpsprovider v1.57.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.57.0