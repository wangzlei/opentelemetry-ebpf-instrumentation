extensions:
  # SigV4 signer for the CloudWatch Metrics OTLP endpoint (service "monitoring").
  sigv4auth:
    region: us-west-2
    service: monitoring
  # SigV4 signer for the CloudWatch/X-Ray traces OTLP endpoint (service "xray").
  sigv4auth/xray:
    region: us-west-2
    service: xray

receivers:
  obi:
    open_port: "8000"
    log_level: INFO
    ebpf:
      context_propagation: "all"
      bpf_fs_base_dir: /sys/fs/bpf
    metrics:
      features: "application"

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  # CloudWatch OTLP requires DELTA temporality; OBI emits cumulative.
  cumulativetodelta: {}

  # AWS-flavored resource attributes on every span AND metric. OBI's EC2 detection
  # sets host.id / cloud.account.id / cloud.region; copy to the requested keys and
  # derive host.ip from the ip-a-b-c-d internal hostname.
  transform/aws:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["ec2.instance.id"], attributes["host.id"]) where attributes["host.id"] != nil
          - set(attributes["aws.account.id"], attributes["cloud.account.id"]) where attributes["cloud.account.id"] != nil
          - set(attributes["aws.region"], attributes["cloud.region"]) where attributes["cloud.region"] != nil
          - set(attributes["host.ip"], attributes["host.name"]) where attributes["host.name"] != nil
          - replace_pattern(attributes["host.ip"], "^ip-([0-9]+)-([0-9]+)-([0-9]+)-([0-9]+).*$", "$$1.$$2.$$3.$$4") where attributes["host.ip"] != nil
    metric_statements:
      - context: resource
        statements:
          - set(attributes["ec2.instance.id"], attributes["host.id"]) where attributes["host.id"] != nil
          - set(attributes["aws.account.id"], attributes["cloud.account.id"]) where attributes["cloud.account.id"] != nil
          - set(attributes["aws.region"], attributes["cloud.region"]) where attributes["cloud.region"] != nil
          - set(attributes["host.ip"], attributes["host.name"]) where attributes["host.name"] != nil
          - replace_pattern(attributes["host.ip"], "^ip-([0-9]+)-([0-9]+)-([0-9]+)-([0-9]+).*$", "$$1.$$2.$$3.$$4") where attributes["host.ip"] != nil

exporters:
  debug:
    verbosity: normal
  # CloudWatch Metrics OTLP ingest (us-west-2). otlphttp appends /v1/metrics.
  otlphttp/cloudwatch:
    endpoint: https://monitoring.us-west-2.amazonaws.com
    compression: gzip
    auth:
      authenticator: sigv4auth
  # CloudWatch/X-Ray traces OTLP ingest (us-west-2). otlphttp appends /v1/traces.
  otlphttp/xray:
    endpoint: https://xray.us-west-2.amazonaws.com
    compression: gzip
    auth:
      authenticator: sigv4auth/xray

service:
  extensions: [sigv4auth, sigv4auth/xray]
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    # OBI-native RED → CloudWatch. Accurate counts; client metric carries the
    # experimental peer.service.name; resource carries the AWS-flavored attrs.
    metrics:
      receivers: [obi]
      processors: [transform/aws, cumulativetodelta, batch]
      exporters: [otlphttp/cloudwatch, debug]
    # All spans → CloudWatch/X-Ray OTLP, with the same AWS resource attrs.
    traces:
      receivers: [obi]
      processors: [transform/aws, batch]
      exporters: [otlphttp/xray, debug]
